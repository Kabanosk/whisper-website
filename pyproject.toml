[project]
name = "whisper-website"
version = "0.1.0"
description = "Self-hosted web app for converting audio to text/subtitles using OpenAI's Whisper"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "stable-ts",
    "loguru",
    "torch",
    "deep_translator",
    "srt~=3.5.3",
    "starlette>=1.6.0",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

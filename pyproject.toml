[project]
name = "whisper-website"
version = "0.1.0"
description = "Self-hosted web app for converting audio to text/subtitles using OpenAI's Whisper"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "stable-ts",
    "loguru",
    "numpy",
    "torch",
    "tqdm",
    "more-itertools",
    "transformers>=4.19.0",
    "ffmpeg-python==0.2.0",
    "deep_translator",
    "srt~=3.5.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
